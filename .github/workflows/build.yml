name: Check and build the package

# GitHub is the source of truth and publishes releases. This file remains valid
# Forgejo Actions syntax so the read-only mirror can run the same checks when
# asked, but mirror synchronization is not a release event.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v6.1.0 uses Node 24 and is pinned so a moving third-party tag cannot
      # change code that also runs for pull requests. Forgejo's action mirror
      # carries this exact upstream commit as well.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # without the history `git describe` sees no tags
          fetch-depth: 0
          # Tests execute pull-request code and never need a Git credential.
          persist-credentials: false

      - name: Provide PHP
        run: |
          php -v >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends php-cli

      - name: Run the tests
        # Syntax for every language in the tree, the behaviour checks, and the
        # package that gets built. The wrapper runs the same ./tests/run.sh
        # anyone can run locally and also prevents its audit snapshot drifting.
        run: python3 tests/update-audit-report.py --check

      - name: Pull request title and description
        if: github.event_name == 'pull_request'
        # A squash merge turns these into the one commit the release note reads;
        # the same command also refuses empty template sections and excess prose.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/contribution-lint.py --pull-request-event

      - name: Commit messages
        if: github.event_name != 'pull_request'
        # The release note is generated from these, so a message that cannot be
        # read is a note that cannot be written. The same check runs locally
        # through packaging/hooks/commit-msg; this is the one nobody can skip.
        # --pushed works out the range from the event the forge left behind,
        # which GitHub and Forgejo write to the same place in the same shape.
        run: python3 packaging/commit-lint.py --pushed

      - name: Build a non-release CI snapshot
        if: >-
          github.server_url == 'https://github.com' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          set -eu
          python3 packaging/build.py
          package=$(find packaging/dist -type f -name '*.pkg' -print -quit)
          test -n "$package"
          checksum=$(sha256sum "$package" | cut -d' ' -f1)
          printf '%s  %s\n' "$checksum" "$(basename "$package")" > "$package.sha256"

      # GitHub's v7.0.1 uploader uses Node 24. Forgejo 16 requires a different
      # patched action which GitHub refuses while preparing a job, even on a
      # skipped step. The read-only mirror therefore runs the shared checks but
      # does not retain its own copy of GitHub's CI snapshot.
      - name: Keep the CI snapshot for trying out on GitHub
        if: >-
          github.server_url == 'https://github.com' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: os-openid-connect-ci-${{ github.sha }}
          path: |
            packaging/dist/*.pkg
            packaging/dist/*.pkg.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: check
    # A manual dispatch from a tag is still only a check. Publishing happens
    # exactly once: when GitHub receives the tag itself.
    if: >-
      github.server_url == 'https://github.com' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Release assets and the immutable release itself.
      contents: write
      # Short-lived GitHub OIDC identity for Sigstore, with permission to store
      # the resulting build-provenance attestation. No signing key is involved.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the package
        id: build
        run: |
          set -eu
          python3 packaging/build.py
          path=$(find packaging/dist -name '*.pkg' | head -1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "checksum=$(sha256sum "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare checksums, optional offline signature and release notes
        env:
          TAG: ${{ github.ref_name }}
          BASE: ${{ github.server_url }}/${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          PATH_PKG: ${{ steps.build.outputs.path }}
          FILE: ${{ steps.build.outputs.file }}
          CHECKSUM: ${{ steps.build.outputs.checksum }}
          # An RSA private key in PEM form, or unset. `pkg add` verifies
          # nothing about a file handed to it directly, so a package that changes how a
          # firewall authenticates should travel with something to check it against.
          # Without the secret the mandatory GitHub provenance and checksum remain.
          SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          set -eu
          URL="$BASE/releases/download/$TAG/$FILE"

          printf '%s  %s\n' "$CHECKSUM" "$FILE" > "$PATH_PKG.sha256"

          if [ -n "${SIGNING_KEY:-}" ]; then
            if [ ! -s packaging/release-key.pub ]; then
              echo 'PKG_SIGNING_KEY is configured but packaging/release-key.pub is missing.' >&2
              exit 1
            fi
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release.key"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/release.key" \
              -out "$PATH_PKG.sig" "$PATH_PKG"
            rm -f "$RUNNER_TEMP/release.key"
            echo "signed with the release key"
          else
            echo "no offline release key configured; GitHub provenance remains mandatory"
          fi

          python3 packaging/release-notes.py \
            --tag "$TAG" \
            --file "$FILE" \
            --url "$URL" \
            --checksum "$CHECKSUM" \
            --repository "$REPOSITORY" \
            --commit-url "$BASE/commit/" \
            --built-from "$GITHUB_SHA" \
            ${SIGNING_KEY:+--signed} > "$RUNNER_TEMP/notes.md"

      # v4.2.2 is pinned: moving action tags must not change release code.
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.build.outputs.path }}

      - name: Publish the complete immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PATH_PKG: ${{ steps.build.outputs.path }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $TAG is already published and must never be replaced; use a new version." >&2
              exit 1
            fi
            # A failed earlier run may leave only an unpublished draft. Rebuild
            # that private staging area from zero; a published release is never touched.
            gh release delete "$TAG" --yes
          fi

          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease

          assets="$PATH_PKG $PATH_PKG.sha256"
          if [ -f "$PATH_PKG.sig" ]; then
            assets="$assets $PATH_PKG.sig"
          fi
          # shellcheck disable=SC2086 -- each generated asset path contains no whitespace
          gh release upload "$TAG" $assets

          uploaded=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          expected=0
          for asset in $assets; do
            expected=$((expected + 1))
            name=$(basename "$asset")
            printf '%s\n' "$uploaded" | grep -Fqx "$name" || {
              echo "Draft release is missing expected asset $name." >&2
              exit 1
            }
          done
          if [ "$(printf '%s\n' "$uploaded" | sed '/^$/d' | wc -l)" -ne "$expected" ]; then
            echo 'Draft release contains an unexpected asset.' >&2
            exit 1
          fi

          # Publication is the one-way boundary: repository release immutability
          # locks the tag and every asset and creates a GitHub release attestation.
          gh release edit "$TAG" --draft=false
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)" != "true" ]; then
            echo 'GitHub published the release without immutability; enable the repository policy.' >&2
            exit 1
          fi
          echo "$FILE published once as an immutable, attested release."
