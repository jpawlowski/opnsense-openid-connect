name: Bug report / Fehlerbericht
description: Report observable incorrect behaviour in English or German.
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the complete issue to at most **175 counted prose words**. Code, commands, paths, URLs, closing references
        and the AI notice do not count. English and German are accepted; prefer English when in doubt.

        If important supporting context does not fit, publish one comment beginning with `## Details`, then link it
        from the relevant answer as `Details: [maintained comment](permalink)`. Keep this main body self-contained and
        keep its outcome and decision here. Edit the existing detail comment whenever either part changes; do not add
        correction or replacement detail comments. The comment has no separate word limit, but keep it focused.

        Agent-authored text must end with one exact italic notice after the answer under `To decide`, separated as its
        own final paragraph:

        *An AI agent wrote this text on my behalf; I am responsible for its content.*

        *Ein KI-Agent hat diesen Text in meinem Namen verfasst; ich verantworte seinen Inhalt.*
  - type: dropdown
    id: area
    attributes:
      label: Suggested area
      description: Suggest one area. Repository automation or a maintainer confirms the label.
      options:
        - "area: oidc"
        - "area: opnsense"
        - "area: ui"
        - "area: packaging"
        - "area: contribution"
  - type: textarea
    id: tldr
    attributes:
      label: TL;DR
      description: Summarize the observed problem in one or two sentences.
      placeholder: What is wrong, in the shortest useful form?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Name the affected screen, flow, component or version.
      placeholder: Where can the problem be observed?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: Now
      description: State current behaviour and concise reproduction or evidence.
      placeholder: What happens now, and how can it be reproduced?
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: Want
      description: State the expected observable behaviour without implementation detail.
      placeholder: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: to_decide
    attributes:
      label: To decide
      description: Name one decision and recommend a high-level direction.
      placeholder: Which single decision is needed, and what direction do you suggest?
    validations:
      required: true
